<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모니 — 가계부</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
:root{
  --navy:#1A1D2E;--navy2:#252840;--purple:#6C63FF;--purpleL:#8B84FF;
  --mint:#00D4AA;--red:#FF6B6B;--yellow:#FFB547;--blue:#60A5FA;
  --bg:#F0F2FA;--card:#fff;--text:#1A1D2E;--t2:#6B7280;--t3:#9CA3AF;
  --border:#E5E7EB;--sh:0 2px 16px rgba(108,99,255,.08);--shL:0 8px 40px rgba(108,99,255,.16);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
.app{display:flex;min-height:100vh;}
/* SIDEBAR */
.sidebar{width:240px;background:var(--navy);padding:28px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;}
.logo{padding:0 24px 28px;display:flex;align-items:center;gap:10px;}
.logo-icon{width:36px;height:36px;background:var(--purple);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.logo-text{font-size:20px;font-weight:800;color:#fff;letter-spacing:-.5px;}
.logo-text span{color:var(--purpleL);}
.nav-section{padding:0 12px;flex:1;overflow-y:auto;}
.nav-label{font-size:10px;font-weight:600;letter-spacing:1.2px;color:#4B5563;padding:0 12px;margin-bottom:6px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#9CA3AF;cursor:pointer;transition:all .15s;font-weight:500;margin-bottom:2px;font-size:13.5px;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#E5E7EB;}
.nav-item.active{background:var(--purple);color:#fff;}
.nav-item .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
.sidebar-bottom{padding:16px 12px 0;border-top:1px solid rgba(255,255,255,.06);margin:0 12px;}
.user-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;}
.user-avatar{width:32px;height:32px;background:var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:700;flex-shrink:0;}
.user-name{font-size:13px;font-weight:600;color:#E5E7EB;}
.user-plan{font-size:11px;color:#6B7280;}
/* MAIN */
.main{margin-left:240px;flex:1;padding:32px;max-width:calc(100vw - 240px);}
.page{display:none;}.page.active{display:block;}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:16px;flex-wrap:wrap;}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.3px;}
.page-subtitle{font-size:13px;color:var(--t2);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.month-nav{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:7px 14px;box-shadow:var(--sh);}
.month-nav button{background:none;border:none;cursor:pointer;color:var(--t2);font-size:16px;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.month-nav button:hover{background:var(--bg);}
.cur-month{font-weight:700;font-size:14px;min-width:70px;text-align:center;}
.view-toggle{display:flex;background:var(--card);border-radius:10px;padding:3px;box-shadow:var(--sh);}
.view-btn{padding:6px 14px;border-radius:8px;border:none;background:none;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;transition:all .15s;font-family:inherit;}
.view-btn.active{background:var(--purple);color:#fff;}
/* SUMMARY */
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px;}
.sum-card{background:var(--card);border-radius:16px;padding:20px 24px;box-shadow:var(--sh);position:relative;overflow:hidden;}
.sum-card.hl{background:var(--navy);color:#fff;}
.sum-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.06;}
.sum-card.inc::before{background:var(--mint);}.sum-card.exp::before{background:var(--red);}
.sum-label{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.sum-card.hl .sum-label{color:rgba(255,255,255,.6);}
.sum-dot{width:8px;height:8px;border-radius:50%;}
.sum-amt{font-size:26px;font-weight:800;letter-spacing:-1px;}
.sum-card.hl .sum-amt{color:#fff;}
.sum-card.inc .sum-amt{color:var(--mint);}
.sum-card.exp .sum-amt{color:var(--red);}
.sum-sub{font-size:12px;color:var(--t3);margin-top:6px;}
.sum-card.hl .sum-sub{color:rgba(255,255,255,.4);}
/* CONTENT */
.content-grid{display:grid;grid-template-columns:1fr 360px;gap:20px;}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden;}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px 14px;border-bottom:1px solid var(--border);}
.card-title{font-size:15px;font-weight:700;}
.card-action{font-size:12px;font-weight:600;color:var(--purple);cursor:pointer;background:rgba(108,99,255,.08);padding:5px 12px;border-radius:20px;border:none;transition:background .15s;font-family:inherit;}
.card-action:hover{background:rgba(108,99,255,.16);}
/* ADD FORM */
.add-form{padding:20px 24px;border-bottom:1px solid var(--border);display:none;background:#FAFBFF;}
.add-form.visible{display:block;}
.form-tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:14px;}
.form-tab{flex:1;text-align:center;padding:7px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--t2);transition:all .15s;border:none;background:none;font-family:inherit;}
.form-tab.ae{background:var(--red);color:#fff;}
.form-tab.ai{background:var(--mint);color:#fff;}
.form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.form-field{flex:1;min-width:100px;display:flex;flex-direction:column;gap:5px;}
.form-field label{font-size:11px;font-weight:600;color:var(--t2);letter-spacing:.3px;}
.form-field input,.form-field select{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;color:var(--text);background:var(--card);outline:none;transition:border .15s;}
.form-field input:focus,.form-field select:focus{border-color:var(--purple);}
.btn-add{width:100%;padding:11px;background:var(--purple);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-add:hover{background:var(--purpleL);transform:translateY(-1px);}
/* SPLIT */
.split-section{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:12px;}
.split-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.split-title{font-size:12px;font-weight:700;color:var(--t2);}
.split-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.split-row input,.split-row select{padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;color:var(--text);background:var(--card);outline:none;flex:1;}
.split-row input:focus,.split-row select:focus{border-color:var(--purple);}
.split-del{width:24px;height:24px;border:none;background:#FFE5E5;color:var(--red);border-radius:6px;cursor:pointer;font-size:12px;flex-shrink:0;}
.split-add-btn{font-size:12px;font-weight:600;color:var(--purple);background:none;border:none;cursor:pointer;font-family:inherit;}
.split-rem{font-size:11px;color:var(--t3);margin-top:6px;}
.split-rem.over{color:var(--red);}
/* TX LIST */
.tx-date-label{padding:10px 24px 6px;font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.tx-item{display:flex;align-items:center;gap:12px;padding:13px 24px;border-bottom:1px solid var(--border);transition:background .12s;cursor:pointer;}
.tx-item:last-child{border-bottom:none;}
.tx-item:hover{background:#FAFBFF;}
.tx-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.tx-info{flex:1;min-width:0;}
.tx-name{font-size:14px;font-weight:600;}
.tx-cat{font-size:12px;color:var(--t2);margin-top:2px;}
.tx-right{text-align:right;flex-shrink:0;}
.tx-amt{font-size:15px;font-weight:700;}
.tx-amt.income{color:var(--mint);}
.tx-amt.expense{color:var(--red);}
.tx-time-lbl{font-size:11px;color:var(--t3);margin-top:2px;}
.tx-del{opacity:0;width:26px;height:26px;border:none;background:var(--bg);border-radius:7px;cursor:pointer;color:var(--t3);font-size:12px;transition:all .12s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tx-item:hover .tx-del{opacity:1;}
.tx-del:hover{background:#FFE5E5;color:var(--red);}
.split-badge{display:inline-flex;align-items:center;gap:3px;background:rgba(108,99,255,.1);color:var(--purple);border-radius:5px;padding:1px 6px;font-size:10px;font-weight:600;margin-left:4px;vertical-align:middle;}
.empty-state{text-align:center;padding:48px 24px;color:var(--t3);}
.empty-icon{font-size:40px;margin-bottom:12px;}
/* CALENDAR */
.cal-wrap{padding:16px 20px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--t3);padding:6px 0;letter-spacing:.5px;}
.cal-dow:first-child{color:#FF6B6B;}
.cal-dow:last-child{color:var(--blue);}
.cal-day{min-height:80px;border-radius:10px;padding:6px;cursor:pointer;transition:background .12s;border:1.5px solid transparent;}
.cal-day:hover{background:var(--bg);}
.cal-day.today{border-color:var(--purple);}
.cal-day.selected{background:rgba(108,99,255,.08);border-color:var(--purple);}
.cal-day.other-month .cal-dn{color:var(--t3);}
.cal-dn{font-size:13px;font-weight:600;margin-bottom:3px;}
.cal-sun .cal-dn{color:#FF6B6B;}
.cal-sat .cal-dn{color:var(--blue);}
.cal-dots{display:flex;flex-direction:column;gap:2px;}
.cal-dot{font-size:9px;font-weight:600;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-dot.inc{background:rgba(0,212,170,.12);color:var(--mint);}
.cal-dot.exp{background:rgba(255,107,107,.12);color:var(--red);}
.cal-ast-icons{font-size:9px;color:var(--t3);margin-top:1px;}
.cal-det{padding:16px 24px;border-top:1px solid var(--border);background:#FAFBFF;display:none;}
.cal-det.visible{display:block;}
.cal-det-title{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--t2);}
.cal-ast-sum{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;}
.cal-ast-chip{font-size:11px;border-radius:6px;padding:2px 8px;font-weight:600;}
/* RIGHT PANEL */
.right-panel{display:flex;flex-direction:column;gap:20px;}
.chart-wrap{position:relative;width:160px;height:160px;margin:0 auto 16px;}
.donut-svg{transform:rotate(-90deg);}
.donut-hole{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.donut-total{font-size:18px;font-weight:800;color:var(--red);}
.donut-lbl{font-size:11px;color:var(--t3);margin-top:2px;}
.legend-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
.legend-item:last-child{border-bottom:none;}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.legend-name{flex:1;font-size:13px;font-weight:500;}
.legend-amt{font-size:13px;font-weight:700;}
.legend-pct{font-size:11px;color:var(--t3);}
.budget-item{padding:0 24px 14px;}
.budget-top{display:flex;justify-content:space-between;margin-bottom:5px;}
.budget-cat{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;}
.budget-nums{font-size:12px;color:var(--t2);}
.budget-bar-bg{height:6px;background:var(--bg);border-radius:10px;overflow:hidden;}
.budget-bar-fill{height:100%;border-radius:10px;transition:width .6s cubic-bezier(.4,0,.2,1);}
/* ASSETS */
.assets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px;}
.asset-card{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden;}
.asset-type-hdr{padding:14px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.asset-type-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;}
.asset-type-name{font-size:14px;font-weight:700;}
.asset-type-total{font-size:12px;color:var(--t2);margin-top:1px;}
.asset-sort-btns{margin-left:auto;display:flex;gap:3px;}
.asset-sort-btn{font-size:10px;padding:3px 7px;border-radius:6px;border:1px solid var(--border);background:none;cursor:pointer;color:var(--t2);font-family:inherit;transition:all .12s;}
.asset-sort-btn.active{background:var(--purple);color:#fff;border-color:var(--purple);}
.asset-item{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.asset-item:last-child{border-bottom:none;}
.asset-item:hover{background:var(--bg);}
.asset-item-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.asset-item-info{flex:1;}
.asset-item-name{font-size:14px;font-weight:600;}
.asset-item-sub{font-size:12px;color:var(--t2);margin-top:1px;}
.asset-item-amt{font-size:15px;font-weight:700;flex-shrink:0;}
.asset-item-del{opacity:0;width:24px;height:24px;border:none;background:#FFE5E5;color:var(--red);border-radius:6px;cursor:pointer;font-size:12px;flex-shrink:0;transition:opacity .12s;}
.asset-item:hover .asset-item-del{opacity:1;}
.asset-add-btn{display:flex;align-items:center;gap:8px;padding:12px 18px;color:var(--purple);font-size:13px;font-weight:600;cursor:pointer;transition:background .12s;}
.asset-add-btn:hover{background:rgba(108,99,255,.06);}
.asset-summary{background:var(--navy);border-radius:16px;padding:24px;box-shadow:var(--shL);color:#fff;margin-bottom:20px;}
.asset-summary-title{font-size:13px;font-weight:600;color:rgba(255,255,255,.5);margin-bottom:8px;}
.asset-summary-total{font-size:36px;font-weight:900;letter-spacing:-1.5px;color:var(--mint);margin-bottom:16px;}
.asset-summary-row{display:flex;gap:24px;flex-wrap:wrap;}
.asset-summary-item{flex:1;}
.asset-summary-label{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:4px;}
.asset-summary-value{font-size:16px;font-weight:700;}
.card-link-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(108,99,255,.1);color:var(--purple);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;margin-top:3px;}
/* CATEGORIES */
.cat-page-tabs{display:flex;background:var(--card);border-radius:12px;padding:4px;box-shadow:var(--sh);margin-bottom:16px;width:fit-content;}
.cat-page-tab{padding:8px 24px;border-radius:9px;border:none;background:none;font-size:13px;font-weight:600;cursor:pointer;color:var(--t2);transition:all .15s;font-family:inherit;}
.cat-page-tab.ae{background:var(--red);color:#fff;}
.cat-page-tab.ai{background:var(--mint);color:#fff;}
.cat-sort-bar{display:flex;gap:6px;margin-bottom:16px;align-items:center;}
.cat-sort-bar span{font-size:12px;color:var(--t2);font-weight:600;}
.cat-sort-btn{font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;color:var(--t2);font-family:inherit;transition:all .12s;}
.cat-sort-btn.active{background:var(--purple);color:#fff;border-color:var(--purple);}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.cat-item{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:16px;display:flex;align-items:center;gap:12px;position:relative;}
.cat-item-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.cat-item-name{font-size:14px;font-weight:600;flex:1;}
.cat-item-sub{font-size:11px;color:var(--t3);}
.cat-item-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s;}
.cat-item:hover .cat-item-actions{opacity:1;}
.cat-act-btn{width:26px;height:26px;border:none;border-radius:7px;background:var(--bg);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:background .12s;}
.cat-act-btn:hover{background:var(--border);}
.cat-act-btn.del:hover{background:#FFE5E5;}
.cat-add-card{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--purple);font-size:13px;font-weight:600;border:2px dashed var(--border);transition:all .15s;}
.cat-add-card:hover{border-color:var(--purple);background:rgba(108,99,255,.04);}
/* BUDGET */
.budget-edit-card{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden;max-width:640px;}
.budget-edit-row{display:flex;align-items:center;gap:12px;padding:13px 24px;border-bottom:1px solid var(--border);}
.budget-edit-row:last-child{border-bottom:none;}
.budget-edit-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.budget-edit-name{flex:1;font-weight:600;}
.budget-edit-input{width:130px;padding:8px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;text-align:right;outline:none;transition:border .15s;}
.budget-edit-input:focus{border-color:var(--purple);}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border-radius:20px;padding:28px;width:100%;max-width:480px;box-shadow:var(--shL);max-height:90vh;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:800;margin-bottom:20px;}
.modal-field{margin-bottom:14px;}
.modal-field label{display:block;font-size:11px;font-weight:600;color:var(--t2);margin-bottom:6px;letter-spacing:.3px;}
.modal-field input,.modal-field select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;color:var(--text);background:var(--card);outline:none;transition:border .15s;}
.modal-field input:focus,.modal-field select:focus{border-color:var(--purple);}
.modal-btns{display:flex;gap:10px;margin-top:20px;}
.btn-cancel{flex:1;padding:11px;border:1.5px solid var(--border);border-radius:10px;background:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--t2);transition:all .15s;}
.btn-cancel:hover{background:var(--bg);}
.btn-confirm{flex:2;padding:11px;background:var(--purple);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-confirm:hover{background:var(--purpleL);}
.btn-danger{padding:11px 16px;background:none;border:1.5px solid var(--red);color:var(--red);border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-danger:hover{background:#fff0f0;}
/* EMOJI PICKER */
.picker-tabs{display:flex;background:var(--bg);border-radius:8px;padding:3px;margin-bottom:8px;}
.picker-tab{flex:1;text-align:center;padding:5px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;color:var(--t2);transition:all .15s;border:none;background:none;font-family:inherit;}
.picker-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.emoji-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;max-height:160px;overflow-y:auto;padding:2px;}
.emoji-grid::-webkit-scrollbar{width:4px;}.emoji-grid::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.emoji-btn{width:33px;height:33px;border:1.5px solid var(--border);border-radius:8px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;background:none;}
.emoji-btn:hover,.emoji-btn.selected{border-color:var(--purple);background:rgba(108,99,255,.08);}
.custom-emoji-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.custom-emoji-input{padding:7px 10px;border:1.5px solid var(--border);border-radius:9px;font-size:20px;font-family:inherit;outline:none;text-align:center;transition:border .15s;width:70px;}
.custom-emoji-input:focus{border-color:var(--purple);}
.custom-emoji-btn{padding:7px 12px;background:var(--purple);color:#fff;border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
.emoji-preview{font-size:24px;min-width:36px;text-align:center;}
/* COLOR PICKER */
.color-grid{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0;}
.color-btn{width:28px;height:28px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:all .15s;}
.color-btn.selected{border-color:var(--navy);transform:scale(1.2);}
.custom-color-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.custom-color-row label{font-size:12px;color:var(--t2);font-weight:600;}
/* TOAST */
.toast{position:fixed;bottom:28px;right:28px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:var(--shL);transform:translateY(80px);opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:9999;}
.toast.show{transform:translateY(0);opacity:1;}
.fade-in{animation:fi .22s ease;}
@keyframes fi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:1100px){.content-grid{grid-template-columns:1fr;}.right-panel{display:grid;grid-template-columns:1fr 1fr;}}
@media(max-width:900px){.summary-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:768px){.sidebar{width:64px;}.sidebar .logo-text,.sidebar .nav-item span:not(.icon),.sidebar .user-name,.sidebar .user-plan,.sidebar .nav-label{display:none;}.main{margin-left:64px;padding:16px;}.summary-grid{grid-template-columns:1fr;}.right-panel{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app">
<nav class="sidebar">
  <div class="logo"><div class="logo-icon">💰</div><div class="logo-text">mo<span>ni</span></div></div>
  <div class="nav-section">
    <div class="nav-label">메뉴</div>
    <div class="nav-item active" onclick="gotoPage('home',this)"><span class="icon">📊</span><span>홈</span></div>
    <div class="nav-item" onclick="gotoPage('assets',this)"><span class="icon">🏦</span><span>자산</span></div>
    <div class="nav-item" onclick="gotoPage('categories',this)"><span class="icon">🏷️</span><span>분류 관리</span></div>
    <div class="nav-item" onclick="gotoPage('budget',this)"><span class="icon">🎯</span><span>예산</span></div>
  </div>
  <div class="sidebar-bottom">
    <div class="user-card">
      <div class="user-avatar">나</div>
      <div><div class="user-name">내 가계부</div><div class="user-plan">무료 플랜</div></div>
    </div>
  </div>
</nav>
<main class="main">
<div class="page active" id="page-home">
  <div class="page-header">
    <div><div class="page-title">💳 가계부</div><div class="page-subtitle">수입과 지출을 한눈에 확인하세요</div></div>
    <div class="header-right">
      <div class="view-toggle">
        <button class="view-btn active" id="vbList" onclick="setView('list')">📋 목록</button>
        <button class="view-btn" id="vbCal" onclick="setView('calendar')">📅 달력</button>
      </div>
      <div class="month-nav">
        <button onclick="changeMonth(-1)">&#8249;</button>
        <div class="cur-month" id="monthLabel"></div>
        <button onclick="changeMonth(1)">&#8250;</button>
      </div>
    </div>
  </div>
  <div class="summary-grid">
    <div class="sum-card hl"><div class="sum-label">💼 이번 달 잔액</div><div class="sum-amt" id="balAmt">₩0</div><div class="sum-sub" id="balSub"></div></div>
    <div class="sum-card inc"><div class="sum-label"><div class="sum-dot" style="background:var(--mint)"></div>총 수입</div><div class="sum-amt" id="incAmt">₩0</div><div class="sum-sub" id="incCnt"></div></div>
    <div class="sum-card exp"><div class="sum-label"><div class="sum-dot" style="background:var(--red)"></div>총 지출</div><div class="sum-amt" id="expAmt">₩0</div><div class="sum-sub" id="expCnt"></div></div>
  </div>
  <div class="content-grid">
    <div>
      <div class="card">
        <div class="card-header">
          <div class="card-title" id="listViewTitle">거래 내역</div>
          <button class="card-action" onclick="openAddForm()">+ 추가</button>
        </div>
        <div class="add-form" id="addForm">
          <div class="form-tabs">
            <button class="form-tab ae" id="tabE" onclick="setTxType('expense')">지출</button>
            <button class="form-tab" id="tabI" onclick="setTxType('income')">수입</button>
          </div>
          <div class="form-row">
            <div class="form-field" style="flex:2"><label>항목명</label><input id="fName" placeholder="예) 스타벅스 아메리카노"></div>
            <div class="form-field"><label>금액 (원)</label><input type="number" id="fAmt" placeholder="0" min="0" oninput="onAmtInput()"></div>
          </div>
          <div class="form-row">
            <div class="form-field"><label>카테고리</label><select id="fCat"></select></div>
            <div class="form-field"><label>자산</label><select id="fAsset"><option value="">선택 안 함</option></select></div>
            <div class="form-field"><label>날짜</label><input type="date" id="fDate"></div>
          </div>
          <div class="form-field" style="margin-bottom:10px">
            <label>아이콘 (선택)</label>
            <div id="txIconWrap"></div>
          </div>
          <div id="splitWrap" style="display:none">
            <div class="split-section">
              <div class="split-hdr"><div class="split-title">✂️ 분할 결제 내역</div><button class="split-add-btn" onclick="addSplitItem()">+ 항목 추가</button></div>
              <div id="splitItems"></div>
              <div class="split-rem" id="splitRem"></div>
            </div>
          </div>
          <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px">
            <input type="checkbox" id="splitToggle" onchange="toggleSplit()" style="width:14px;height:14px;accent-color:var(--purple);cursor:pointer">
            <label for="splitToggle" style="font-size:12px;font-weight:600;color:var(--t2);cursor:pointer">분할 결제 (여러 자산에 나눠 결제)</label>
          </div>
          <button class="btn-add" onclick="addTx()">추가하기</button>
        </div>
        <div id="listView"></div>
        <div id="calView" style="display:none">
          <div class="cal-wrap"><div class="cal-grid" id="calGrid"></div></div>
          <div class="cal-det" id="calDet"></div>
        </div>
      </div>
    </div>
    <div class="right-panel">
      <div class="card">
        <div class="card-header"><div class="card-title">지출 분석</div></div>
        <div style="padding:20px 24px 0">
          <div class="chart-wrap">
            <svg class="donut-svg" width="160" height="160" viewBox="0 0 160 160" id="donutSvg">
              <circle cx="80" cy="80" r="60" fill="none" stroke="#F0F2FA" stroke-width="22"/>
            </svg>
            <div class="donut-hole"><div class="donut-total" id="donutTotal">₩0</div><div class="donut-lbl">총 지출</div></div>
          </div>
        </div>
        <div style="padding:0 24px 20px" id="catLegend"><div style="text-align:center;color:var(--t3);font-size:13px;padding:8px 0">지출 내역을 추가해보세요</div></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">예산 현황</div><button class="card-action" onclick="gotoPage('budget',null)">수정</button></div>
        <div id="budgetList" style="padding-top:12px"></div>
      </div>
    </div>
  </div>
</div>
<div class="page" id="page-assets">
  <div class="page-header">
    <div><div class="page-title">🏦 자산 관리</div><div class="page-subtitle">현금, 계좌, 카드, 투자를 한곳에서 관리하세요</div></div>
    <button class="card-action" style="font-size:13px;padding:8px 18px" onclick="openAssetModal()">+ 자산 추가</button>
  </div>
  <div class="asset-summary">
    <div class="asset-summary-title">총 자산</div>
    <div class="asset-summary-total" id="assetTotal">₩0</div>
    <div class="asset-summary-row">
      <div class="asset-summary-item"><div class="asset-summary-label">현금</div><div class="asset-summary-value" id="asCash">₩0</div></div>
      <div class="asset-summary-item"><div class="asset-summary-label">계좌 합계</div><div class="asset-summary-value" id="asBank">₩0</div></div>
      <div class="asset-summary-item"><div class="asset-summary-label">투자 합계</div><div class="asset-summary-value" id="asInvest">₩0</div></div>
      <div class="asset-summary-item"><div class="asset-summary-label">카드 한도</div><div class="asset-summary-value" id="asCard">₩0</div></div>
    </div>
  </div>
  <div class="assets-grid" id="assetsGrid"></div>
</div>
<div class="page" id="page-categories">
  <div class="page-header">
    <div><div class="page-title">🏷️ 분류 관리</div><div class="page-subtitle">카테고리를 자유롭게 편집하세요</div></div>
  </div>
  <div class="cat-page-tabs">
    <button class="cat-page-tab ae" id="catTabE" onclick="setCatTab('expense')">💸 지출 분류</button>
    <button class="cat-page-tab" id="catTabI" onclick="setCatTab('income')">💰 수입 분류</button>
  </div>
  <div class="cat-sort-bar">
    <span>정렬:</span>
    <button class="cat-sort-btn active" id="cso0" onclick="setCatSort('default')">기본</button>
    <button class="cat-sort-btn" id="cso1" onclick="setCatSort('name')">가나다순</button>
    <button class="cat-sort-btn" id="cso2" onclick="setCatSort('amount')">금액순</button>
  </div>
  <div class="cat-grid" id="catGrid"></div>
</div>
<div class="page" id="page-budget">
  <div class="page-header">
    <div><div class="page-title">🎯 예산 설정</div><div class="page-subtitle">카테고리별 월 예산을 설정하세요</div></div>
  </div>
  <div class="budget-edit-card" id="budgetEditCard"></div>
</div>
</main>
</div>

<div class="modal-overlay" id="txModal">
  <div class="modal">
    <div class="modal-title">거래 수정</div>
    <div class="modal-field"><label>항목명</label><input id="txMName"></div>
    <div class="modal-field"><label>금액 (원)</label><input type="number" id="txMAmt" min="0"></div>
    <div class="modal-field"><label>카테고리</label><select id="txMCat"></select></div>
    <div class="modal-field"><label>자산</label><select id="txMAsset"><option value="">선택 안 함</option></select></div>
    <div class="modal-field"><label>날짜</label><input type="date" id="txMDate"></div>
    <div class="modal-field"><label>아이콘 (선택)</label><div id="txMIconWrap"></div></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('txModal')">취소</button>
      <button class="btn-danger" onclick="deleteTxModal()">삭제</button>
      <button class="btn-confirm" onclick="saveTxEdit()">저장</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="assetModal">
  <div class="modal">
    <div class="modal-title" id="assetModalTitle">자산 추가</div>
    <div class="modal-field">
      <label>자산 종류</label>
      <select id="astType" onchange="onAssetTypeChange()">
        <option value="cash">현금</option>
        <option value="bank">계좌</option>
        <option value="invest">투자</option>
        <option value="card">카드</option>
      </select>
    </div>
    <div class="modal-field"><label>자산 이름</label><input id="astName" placeholder="예) 카카오뱅크, 국민카드"></div>
    <div class="modal-field"><label>아이콘 (선택)</label><div id="astIconWrap"></div></div>
    <div class="modal-field" id="divAstAmt"><label id="lblAstAmt">잔액 (원)</label><input type="number" id="astAmt" placeholder="0"></div>
    <div class="modal-field" id="divAstLink" style="display:none">
      <label>연동할 계좌 (선택)</label>
      <select id="astLink"><option value="">선택 안 함</option></select>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('assetModal')">취소</button>
      <button class="btn-danger" id="assetDelBtn" style="display:none" onclick="deleteAsset()">삭제</button>
      <button class="btn-confirm" onclick="saveAsset()">저장</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="catModal">
  <div class="modal">
    <div class="modal-title" id="catModalTitle">분류 추가</div>
    <div class="modal-field"><label>이름</label><input id="catName" placeholder="예) 반려동물"></div>
    <div class="modal-field"><label>아이콘</label><div id="catEmojiWrap"></div></div>
    <div class="modal-field">
      <label>색상</label>
      <div class="color-grid" id="catColorGrid"></div>
      <div class="custom-color-row">
        <label>직접 선택:</label>
        <input type="color" id="catCustomColor" style="width:40px;height:30px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;padding:2px;" onchange="onCustomColor(this.value)">
      </div>
    </div>
    <div id="catBudgetField" class="modal-field"><label>월 예산 (원, 지출 전용)</label><input type="number" id="catBudget" placeholder="0"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('catModal')">취소</button>
      <button class="btn-danger" id="catDelBtn" style="display:none" onclick="deleteCat()">삭제</button>
      <button class="btn-confirm" onclick="saveCat()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const EMOJI_PAGES={
  '일반':['💵','💴','💶','🏦','🏧','💳','💰','🪙','💼','📈','📊','💡','🎯','🔑','📮','🏆'],
  '음식':['🍽️','🍜','🍣','🍕','🍔','☕','🧋','🍰','🥗','🍱','🥘','🍖','🍺','🥂','🧃','🍎'],
  '쇼핑':['🛍️','👗','👠','👜','💄','⌚','📱','💻','🎮','📚','🎵','🖼️','🏺','🪴','🧸','🎁'],
  '생활':['🏠','🚗','🛵','✈️','🚌','🚇','🚕','⛽','💊','🏥','🏋️','🔌','🛠️','🧹','🚿','🐶'],
  '기타':['📦','🎬','🎤','🎨','🎪','🌟','🌈','🔔','❤️','⭐','🔥','💫','🎉','🏅','🌿','🦋'],
};
const COLOR_LIST=['#FF6B6B','#FF8FAB','#FFB547','#FFD700','#00D4AA','#34D399','#60A5FA','#6C63FF','#C084FC','#F97316','#14B8A6','#9CA3AF','#EF4444','#8B5CF6','#EC4899','#1D4ED8'];

const DEF_CATS={
  expense:[
    {id:'c1',name:'식비',icon:'🍽️',color:'#FF6B6B',budget:400000},
    {id:'c2',name:'교통',icon:'🚌',color:'#6C63FF',budget:100000},
    {id:'c3',name:'쇼핑',icon:'🛍️',color:'#FFB547',budget:200000},
    {id:'c4',name:'문화/여가',icon:'🎬',color:'#00D4AA',budget:150000},
    {id:'c5',name:'의료/건강',icon:'💊',color:'#FF8FAB',budget:100000},
    {id:'c6',name:'카페',icon:'☕',color:'#C084FC',budget:80000},
    {id:'c7',name:'통신',icon:'📱',color:'#60A5FA',budget:70000},
    {id:'c8',name:'주거',icon:'🏠',color:'#34D399',budget:500000},
    {id:'c9',name:'기타',icon:'📦',color:'#9CA3AF',budget:100000},
  ],
  income:[
    {id:'i1',name:'급여',icon:'💼',color:'#00D4AA'},
    {id:'i2',name:'부업',icon:'💡',color:'#6C63FF'},
    {id:'i3',name:'이자/배당',icon:'📈',color:'#FFB547'},
    {id:'i4',name:'기타수입',icon:'🎁',color:'#60A5FA'},
  ]
};

// 샘플 데이터를 배제한 빈 배열 구조
const DEF_ASSETS=[];

function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

let transactions=ls('moni_tx3',[]);
let categories=ls('moni_cats3',JSON.parse(JSON.stringify(DEF_CATS)));
let assets=ls('moni_assets3',JSON.parse(JSON.stringify(DEF_ASSETS)));
let assetSort=ls('moni_asort3',{cash:'default',bank:'default',invest:'default',card:'default'});
let catSort=ls('moni_csort','default');

let curMonth=new Date();curMonth.setDate(1);
let curView='list',curTxType='expense',curCatTab='expense';
let selCalDay=null,editAssetId=null,editCatId=null,editTxId=null;
let selEmoji='',selColor='',curEmojiCtx='',curEmojiPage={};
let splitRows=[];

function save(){
  lsSet('moni_tx3',transactions);lsSet('moni_cats3',categories);
  lsSet('moni_assets3',assets);lsSet('moni_asort3',assetSort);lsSet('moni_csort',catSort);
}

function fmtM(n){return '₩'+Math.abs(n).toLocaleString('ko-KR');}

function getCat(tx){
  return [...categories.expense,...categories.income].find(c=>c.id===tx.catId)||{name:'?',icon:'❓',color:'#9CA3AF'};
}
function getAsset(id){return assets.find(a=>a.id===id)||{name:'?',icon:'❓',type:'cash'};}
function getMonthTx(){
  const y=curMonth.getFullYear(),m=curMonth.getMonth();
  return transactions.filter(t=>{
    const d=new Date(t.date);
    return d.getFullYear()===y&&d.getMonth()===m;
  });
}

function gotoPage(pId,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+pId).classList.add('active');
  if(btn){
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    btn.classList.add('active');
  }
  if(pId==='home')renderAll();
  if(pId==='assets')renderAssets();
  if(pId==='categories')renderCategories();
  if(pId==='budget')renderBudgetEdit();
}

function setView(v){
  curView=v;
  document.getElementById('vbList').classList.toggle('active',v==='list');
  document.getElementById('vbCal').classList.toggle('active',v==='calendar');
  document.getElementById('listView').style.display=v==='list'?'block':'none';
  document.getElementById('calView').style.display=v==='calendar'?'block':'none';
  renderAll();
}

function changeMonth(dir){
  curMonth.setMonth(curMonth.getMonth()+dir);
  renderAll();
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

/* ADD FORM (HOME) */
function openAddForm(){
  const f=document.getElementById('addForm');f.classList.toggle('visible');
  if(f.classList.contains('visible')){
    document.getElementById('fDate').valueAsDate=new Date();
    setTxType('expense');
    curEmojiCtx='txAdd';selEmoji='';
    renderEmojiPicker('txIconWrap');
  }
}

function setTxType(t){
  curTxType=t;
  document.getElementById('tabE').classList.toggle('ae',t==='expense');
  document.getElementById('tabE').classList.toggle('active',t==='expense');
  document.getElementById('tabI').classList.toggle('ai',t==='income');
  document.getElementById('tabI').classList.toggle('active',t==='income');
  
  const cSel=document.getElementById('fCat');
  cSel.innerHTML=categories[t].map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  fillAssetSel('fAsset');
}

function fillAssetSel(elId){
  const s=document.getElementById(elId);
  s.innerHTML='<option value="">선택 안 함</option>'+
    assets.map(a=>`<option value="${a.id}">${a.icon} ${a.name} (${fmtM(a.amount||a.limit||0)})</option>`).join('');
}

function onAmtInput(){
  if(document.getElementById('splitToggle').checked)renderSplitRows();
}

function toggleSplit(){
  const isChecked=document.getElementById('splitToggle').checked;
  document.getElementById('splitWrap').style.display=isChecked?'block':'none';
  if(isChecked&&!splitRows.length){
    addSplitItem();addSplitItem();
  }
  renderSplitRows();
}

function addSplitItem(){
  splitRows.push({assetId:'',amount:0});
  renderSplitRows();
}
function delSplitItem(idx){
  splitRows.splice(idx,1);
  renderSplitRows();
}
function onSplitChange(idx,field,val){
  if(field==='assetId')splitRows[idx].assetId=val;
  else splitRows[idx].amount=parseInt(val)||0;
  checkSplitRem();
}

function renderSplitRows(){
  const wrap=document.getElementById('splitItems');
  const totalAmt=parseInt(document.getElementById('fAmt').value)||0;
  wrap.innerHTML=splitRows.map((r,i)=>{
    const opt=assets.map(a=>`<option value="${a.id}"${a.id===r.assetId?' selected':''}>${a.icon} ${a.name}</option>`).join('');
    return `<div class="split-row">
      <select onchange="onSplitChange(${i},'assetId',this.value)"><option value="">자산 선택</option>${opt}</select>
      <input type="number" value="${r.amount||''}" placeholder="금0" oninput="onSplitChange(${i},'amount',this.value)">
      <button class="split-del" onclick="delSplitItem(${i})">✕</button>
    </div>`;
  }).join('');
  checkSplitRem();
}

function checkSplitRem(){
  const totalAmt=parseInt(document.getElementById('fAmt').value)||0;
  const sum=splitRows.reduce((s,r)=>s+r.amount,0);
  const rem=totalAmt-sum;
  const lbl=document.getElementById('splitRem');
  if(rem===0){lbl.textContent='✅ 금액 분할이 일치합니다';lbl.className='split-rem';}
  else if(rem>0){lbl.textContent=' 남은 분할 필요 금액: '+fmtM(rem);lbl.className='split-rem';}
  else{lbl.textContent='⚠️ 설정 금액 초과: '+fmtM(Math.abs(rem));lbl.className='split-rem over';}
}

function addTx(){
  const name=document.getElementById('fName').value.trim();
  const amount=parseInt(document.getElementById('fAmt').value)||0;
  const catId=document.getElementById('fCat').value;
  const assetId=document.getElementById('fAsset').value;
  const date=document.getElementById('fDate').value;
  if(!name||!amount||!date){showToast('⚠️ 필수 항목을 기입하세요');return;}
  const cat=categories[curTxType].find(c=>c.id===catId);
  const dObj=new Date();const time=`${String(dObj.getHours()).padStart(2,'0')}:${String(dObj.getMinutes()).padStart(2,'0')}`;
  const icon=selEmoji||null;

  if(document.getElementById('splitToggle').checked){
    const sum=splitRows.reduce((s,r)=>s+r.amount,0);
    if(sum!==amount){showToast('⚠️ 분할 결제 합계가 총 금액과 일치하지 않습니다');return;}
    const gId=Date.now();
    splitRows.forEach((sr,idx)=>{
      transactions.unshift({id:gId+idx,name:`[분할] ${name}`,amount:sr.amount,catId:cat.id,catName:cat.name,type:curTxType,date,assetId:sr.assetId,time,splitGroup:gId,icon});
    });
    showToast('✂️ 분할 결제 내역이 기록되었습니다');
  }else{
    transactions.unshift({id:Date.now(),name,amount,catId:cat.id,catName:cat.name,type:curTxType,date,assetId,time,icon});
    showToast(curTxType==='expense'?'💸 지출이 기록되었습니다':'💰 수입이 기록되었습니다');
  }
  save();renderAll();
  document.getElementById('fName').value='';document.getElementById('fAmt').value='';
  document.getElementById('addForm').classList.remove('visible');
  splitRows=[];document.getElementById('splitToggle').checked=false;document.getElementById('splitWrap').style.display='none';
  selEmoji='';
}

function renderAll(){

function renderSummary(txs){
  const inc=txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const exp=txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const bal=inc-exp;
  const bE=document.getElementById('balAmt');
  bE.textContent=fmtM(bal);bE.style.color=bal>=0?'var(--mint)':'var(--red)';

function renderList(txs){
  const el=document.getElementById('listView');
  if(!txs.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">🧾</div><p>이번 달 거래 내역이 없습니다<br>+ 추가 버튼을 눌러 시작하세요</p></div>';return;}
  const g={};
  [...txs].sort((a,b)=>new Date(b.date)-new Date(a.date)||b.id-a.id).forEach(t=>{
    const d=new Date(t.date);
    const k=`${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`;
    if(!g[k])g[k]=[];g[k].push(t);
  });
  el.innerHTML=Object.entries(g).map(([dk,items])=>`<div class="fade-in"><div class="tx-date-label">${dk}</div>${items.map(t=>txItemHTML(t,false)).join('')}</div>`).join('');
}

/* CALENDAR */
function renderCalendar(){
  const y=curMonth.getFullYear(),m=curMonth.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0),startDow=first.getDay();
  const txs=getMonthTx();
  const dayMap={};
  txs.forEach(t=>{dayMap[t.date]=dayMap[t.date]||[];dayMap[t.date].push(t);});
  
  let h='<div class="cal-dow">일</div><div class="cal-dow">월</div><div class="cal-dow">화</div><div class="cal-dow">수</div><div class="cal-dow">목</div><div class="cal-dow">금</div><div class="cal-dow">토</div>';
  
  const prevLast=new Date(y,m,0).getDate();
  for(let i=startDow-1;i>=0;i--){
    h+=`<div class="cal-day other-month"><div class="cal-dn">${prevLast-i}</div></div>`;
  }
  
  const todayStr=new Date().toISOString().split('T')[0];
  for(let d=1;d<=last.getDate();d++){
    const curDateStr=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dTxs=dayMap[curDateStr]||[];
    const incSum=dTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const expSum=dTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    
    let dots='';
    if(incSum>0)dots+=`<div class="cal-dot inc">+${incSum.toLocaleString()}</div>`;
    if(expSum>0)dots+=`<div class="cal-dot exp">-${expSum.toLocaleString()}</div>`;
    
    const astIcons=[...new Set(dTxs.filter(t=>t.assetId).map(t=>getAsset(t.assetId).icon))].join('');
    const astDiv=astIcons?`<div class="cal-ast-icons">${astIcons}</div>`:'';
    
    const isToday=curDateStr===todayStr?' today':'';
    const isSel=curDateStr===selCalDay?' selected':'';
    const dowClass=[' cal-sun','','','','','',' cal-sat'][(startDow+d-1)%7];
    
    h+=`<div class="cal-day${isToday}${isSel}${dowClass}" onclick="selectCalDay('${curDateStr}')">
      <div class="cal-dn">${d}</div>
      <div class="cal-dots">${dots}</div>
      ${astDiv}
    </div>`;
  }
  document.getElementById('calGrid').innerHTML=h;
  renderCalDetail();
}

function selectCalDay(dStr){selCalDay=dStr;renderCalendar();}
function renderCalDetail(){
  const dE=document.getElementById('calDet');
  if(!selCalDay){dE.style.display='none';return;}
  const dTxs=transactions.filter(t=>t.date===selCalDay);
  dE.style.display='block';
  if(!dTxs.length){dE.innerHTML=`<div class="cal-det-title">📅 ${selCalDay}</div><p style="color:var(--t3);font-size:13px">지정 거래 내역이 없습니다</p>`;return;}
  
  const astSums={};
  dTxs.forEach(t=>{
    if(!t.assetId)return;
    const a=getAsset(t.assetId);
    astSums[a.id]=astSums[a.id]||{n:a.name,i:a.icon,s:0};
    astSums[a.id].s+=(t.type==='income'?t.amount:-t.amount);
  });
  
  const chips=Object.values(astSums).map(v=>`<span class="cal-ast-chip" style="background:${v.s>=0?'rgba(0,212,170,.1);color:var(--mint)':'rgba(255,107,107,.1);color:var(--red)'}">${v.i} ${v.n}: ${v.s>=0?'+':''}${v.s.toLocaleString()}</span>`).join('');
  dE.innerHTML=`<div class="cal-det-title">📅 ${selCalDay} 상세 정보</div>
    ${chips?`<div class="cal-ast-sum">${chips}</div>`:''}
    <div>${dTxs.map(t=>txItemHTML(t,true)).join('')}</div>`;
}

/* CHART & BUDGET (HOME SIDE) */
function renderDonut(txs){
  const exps=txs.filter(t=>t.type==='expense');
  const tot=exps.reduce((s,t)=>s+t.amount,0);
  document.getElementById('donutTotal').textContent=fmtM(tot);
  const byC={};exps.forEach(t=>{byC[t.catName]=(byC[t.catName]||0)+t.amount;});
  const segs=categories.expense.map(c=>({n:c.name,amt:byC[c.name]||0,color:c.color})).filter(s=>s.amt>0).sort((a,b)=>b.amt-a.amt);
  
  const circ=2*Math.PI*60;let off=0;
  const svg=document.getElementById('donutSvg');
  svg.querySelectorAll('.seg').forEach(e=>e.remove());
  
  segs.forEach(s=>{s.p=s.amt/(tot||1);s.d=s.p*circ;s.off=off;off+=s.d;});
  svg.innerHTML+=segs.map(s=>`<circle class="seg" cx="80" cy="80" r="60" fill="none" stroke="${s.color}" stroke-width="22" stroke-dasharray="${s.d} ${circ-s.d}" stroke-dashoffset="${-s.off}"/>`).join('');
  document.getElementById('catLegend').innerHTML=segs.length===0?
    '<div style="text-align:center;color:var(--t3);font-size:13px;padding:8px 0">지출 내역을 추가해보세요</div>':
    segs.slice(0,6).map(s=>`<div class="legend-item"><div class="legend-dot" style="background:${s.color}"></div><div class="legend-name">${s.n}</div><div><div class="legend-amt">${fmtM(s.amt)}</div><div class="legend-pct">${(s.p*100).toFixed(0)}%</div></div></div>`).join('');
}

function renderBudget(txs){
  const byC={};txs.filter(t=>t.type==='expense').forEach(t=>{byC[t.catName]=(byC[t.catName]||0)+t.amount;});
  const bCats=categories.expense.filter(c=>c.budget>0);
  document.getElementById('budgetList').innerHTML=bCats.length===0?
    '<div style="text-align:center;color:var(--t3);font-size:13px;padding:12px 0">설정된 예산이 없습니다</div>':
    bCats.slice(0,5).map(c=>{
      const spent=byC[c.name]||0,pct=Math.min((spent/c.budget)*100,100);
      const over=spent>c.budget,color=over?'var(--red)':pct>70?'var(--yellow)':c.color;
      return `<div class="budget-item"><div class="budget-top"><div class="budget-cat">${c.icon} ${c.name}</div><div class="budget-nums"><span style="font-weight:700;color:${color}">${fmtM(spent)}</span> / ${fmtM(c.budget)}</div></div><div class="budget-bar-bg"><div class="budget-bar-fill" style="width:${pct}%;background:${color}"></div></div></div>`;
    }).join('');
}

function renderBudgetEdit(){
  document.getElementById('budgetEditCard').innerHTML=`
    <div class="card-header"><div class="card-title">월 예산 설정</div></div>
    ${categories.expense.map(c=>`<div class="budget-edit-row"><div class="budget-edit-icon" style="background:${c.color}20">${c.icon}</div><div class="budget-edit-name">${c.name}</div><input class="budget-edit-input" type="number" value="${c.budget||0}" min="0" step="10000" onchange="categories.expense.find(x=>x.id==='${c.id}').budget=parseInt(this.value)||0;save()" onfocus="this.style.borderColor='var(--purple)'" onblur="this.style.borderColor='var(--border)'"><span style="color:var(--t3);font-size:12px">원</span></div>`).join('')}
    <div style="padding:16px 24px;text-align:right"><button class="btn-confirm" style="width:auto;padding:10px 28px" onclick="showToast('✅ 예산이 저장되었습니다')">저장 완료</button></div>`;
}

/* ASSETS PAGE */
function renderAssets(){
  const cash=assets.filter(a=>a.type==='cash').reduce((s,a)=>s+a.amount,0);
  const bank=assets.filter(a=>a.type==='bank').reduce((s,a)=>s+a.amount,0);
  const invest=assets.filter(a=>a.type==='invest').reduce((s,a)=>s+a.amount,0);
  const card=assets.filter(a=>a.type==='card').reduce((s,a)=>s+(a.limit||0),0);
  
  // 총 자산 산정 방식 반영 (현금 + 계좌 + 투자)
  document.getElementById('assetTotal').textContent=fmtM(cash+bank+invest);
  document.getElementById('asCash').textContent=fmtM(cash);
  document.getElementById('asBank').textContent=fmtM(bank);
  document.getElementById('asInvest').textContent=fmtM(invest);
  document.getElementById('asCard').textContent=fmtM(card);
  
  // 투자(invest) 항목 레이아웃 추가 생성
  const groups=[
    {type:'cash',label:'현금',icon:'💵',bg:'#FFB54720'},
    {type:'bank',label:'계좌',icon:'🏦',bg:'#6C63FF20'},
    {type:'invest',label:'투자',icon:'📈',bg:'#60A5FA20'},
    {type:'card',label:'카드',icon:'💳',bg:'#00D4AA20'}
  ];
  
  document.getElementById('assetsGrid').innerHTML=groups.map(g=>{
    let items=assets.filter(a=>a.type===g.type);
    const sm=assetSort[g.type]||'default';
    if(sm==='name')items=[...items].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    else if(sm==='amount')items=[...items].sort((a,b)=>(b.amount||b.limit||0)-(a.amount||a.limit||0));
    
    const tot=items.reduce((s,a)=>s+(a.amount||a.limit||0),0);
    const listHtml=items.map(a=>{
      const sub=g.type==='card'?
        (a.linkedBank?`연동: ${getAsset(a.linkedBank).name}`:'연동 계좌 없음'):
        `잔액: ${fmtM(a.amount||0)}`;
      return `<div class="asset-item" onclick="openAssetModal('${a.id}')">
        <div class="asset-item-icon" style="background:var(--bg)">${a.icon||g.icon}</div>
        <div class="asset-item-info"><div class="asset-item-name">${a.name}</div><div class="asset-item-sub">${sub}</div></div>
        <div class="asset-item-amt">${fmtM(a.amount||a.limit||0)}</div>
      </div>`;
    }).join('');
    
    return `<div class="asset-card">
      <div class="asset-type-hdr">
        <div class="asset-type-icon" style="background:${g.bg}">${g.icon}</div>
        <div><div class="asset-type-name">${g.label}</div><div class="asset-type-total">합계 ${fmtM(tot)}</div></div>
        <div class="asset-sort-btns">
          <button class="asset-sort-btn${sm==='default'?' active':''}" onclick="setAssetSort('${g.type}','default')">기본</button>
          <button class="asset-sort-btn${sm==='name'?' active':''}" onclick="setAssetSort('${g.type}','name')">가나다</button>
          <button class="asset-sort-btn${sm==='amount'?' active':''}" onclick="setAssetSort('${g.type}','amount')">금액</button>
        </div>
      </div>
      <div>${listHtml}</div>
      <div class="asset-add-btn" onclick="openAssetModal(null,'${g.type}')">+ ${g.label} 추가</div>
    </div>`;
  }).join('');
}

function saveAsset(){
  const type=document.getElementById('astType').value;
  const name=document.getElementById('astName').value.trim();
  const amt=parseInt(document.getElementById('astAmt').value)||0;
  if(!name){showToast('⚠️ 자산 이름을 입력해 주세요');return;}
  
  if(editAssetId){
    const a=assets.find(x=>x.id===editAssetId);
    a.name=name;
    if(type==='card'){a.limit=amt;a.linkedBank=document.getElementById('astLink').value;}
    else a.amount=amt;
    a.icon=selEmoji||null;
    showToast('✅ 자산이 수정되었습니다');
  }else{
    const newAst={id:'a_'+Date.now(),type,name,icon:selEmoji||null};
    if(type==='card'){newAst.limit=amt;newAst.linkedBank=document.getElementById('astLink').value;}
    else newAst.amount=amt;
    assets.push(newAst);
    showToast('🏦 새로운 자산이 추가되었습니다');
  }
  save();renderAssets();closeModal('assetModal');
}

function deleteAsset(){
  if(!confirm('이 자산을 지우시겠습니까? 이 자산에 부여된 잔액 정보가 삭제됩니다.'))return;
  assets=assets.filter(x=>x.id!==editAssetId);
  transactions.forEach(t=>{if(t.assetId===editAssetId)t.assetId='';});
  save();renderAssets();closeModal('assetModal');showToast('🗑️ 자산이 제거되었습니다');
}

/* CATEGORIES PAGE */
function renderCategories(){
  document.getElementById('catTabE').classList.toggle('ae',curCatTab='expense');
  document.getElementById('catTabE').classList.toggle('active',curCatTab==='expense');
  document.getElementById('catTabI').classList.toggle('ai',curCatTab==='income');
  document.getElementById('catTabI').classList.toggle('active',curCatTab==='income');
  
  let list=[...categories[curCatTab]];
  if(catSort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  else if(catSort==='amount'){
    const txs=getMonthTx();const sums={};
    txs.filter(t=>t.type==='expense').forEach(t=>{sums[t.catId]=(sums[t.catId]||0)+t.amount;});
    list.sort((a,b)=>(sums[b.id]||0)-(sums[a.id]||0));
  }
  
  const h=list.map(c=>{
    const bStr=curCatTab==='expense'?(c.budget>0?`예산: ${fmtM(c.budget)}`:'예산 미설정'):'';
    return `<div class="cat-item">
      <div class="cat-item-icon" style="background:${c.color}15;color:${c.color}">${c.icon}</div>
      <div class="cat-item-name"><div>${c.name}</div><div class="cat-item-sub">${bStr}</div></div>
      <div class="cat-item-actions">
        <button class="cat-act-btn" onclick="openCatModal('${c.id}')">✏️</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('catGrid').innerHTML=h+`<div class="cat-add-card" onclick="openCatModal(null)">➕ 분류 추가</div>`;
}

function setCatTab(t){curCatTab=t;renderCategories();}
function setCatSort(s){
  catSort=s;
  document.querySelectorAll('.cat-sort-btn').forEach((b,idx)=>b.classList.toggle('active',`cso${idx}`===s));
  ['default','name','amount'].forEach((k,i)=>document.getElementById(`cso${i}`).classList.toggle('active',k===s));
  renderCategories();
}

function openCatModal(id=null){
  editCatId=id;curEmojiCtx='cat';
  const cGrid=document.getElementById('catColorGrid');
  cGrid.innerHTML=COLOR_LIST.map(c=>`<div class="color-btn" style="background:${c}" onclick="pickColor('${c}')"></div>`).join('');
  document.getElementById('catBudgetField').style.display=curCatTab==='expense'?'block':'none';
  
  if(id){
    const c=categories[curCatTab].find(x=>x.id===id);
    document.getElementById('catModalTitle').textContent='분류 수정';
    document.getElementById('catName').value=c.name;
    document.getElementById('catBudget').value=c.budget||'';
    selEmoji=c.icon;selColor=c.color;
    document.getElementById('catDelBtn').style.display='block';
  }else{
    document.getElementById('catModalTitle').textContent='분류 추가';
    document.getElementById('catName').value='';
    document.getElementById('catBudget').value='';
    selEmoji=curCatTab==='expense'?'💸':'💰';selColor=COLOR_LIST[0];
    document.getElementById('catDelBtn').style.display='none';
  }
  pickColor(selColor);
  renderEmojiPicker('catEmojiWrap');
  openModal('catModal');
}

function pickColor(c){
  selColor=c;
  document.querySelectorAll('#catColorGrid .color-btn').forEach(b=>{
    b.classList.toggle('selected',b.style.backgroundColor===c||rgb2hex(b.style.backgroundColor)===c.toLowerCase());
  });
  document.getElementById('catCustomColor').value=c;
}
function rgb2hex(rgb){
  if(/^#[0-9A-F]{6}$/i.test(rgb))return rgb;
  const rgbArr=rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
  if(!rgbArr)return '#ffffff';
  function hex(x){return ('0'+parseInt(x).toString(16)).slice(-2);}
  return '#'+hex(rgbArr[1])+hex(rgbArr[2])+hex(rgbArr[3]);
}
function onCustomColor(v){selColor=v;}

function saveCat(){
  const name=document.getElementById('catName').value.trim();
  const budget=parseInt(document.getElementById('catBudget').value)||0;
  if(!name){showToast('⚠️ 카테고리 이름을 기입하세요');return;}
  
  if(editCatId){
    const c=categories[curCatTab].find(x=>x.id===editCatId);
    c.name=name;c.icon=selEmoji;c.color=selColor;
    if(curCatTab==='expense')c.budget=budget;
    showToast('✅ 카테고리가 변경되었습니다');
  }else{
    const newCat={id:'c_'+Date.now(),name,icon:selEmoji,color:selColor};
    if(curCatTab==='expense')newCat.budget=budget;
    categories[curCatTab].push(newCat);
    showToast('🏷️ 카테고리가 추가되었습니다');
  }
  save();renderCategories();closeModal('catModal');
}

function deleteCat(){
  if(!confirm('이 카테고리를 지우시겠습니까? 기존 거래 기록은 유지되나 식별이 불가할 수 있습니다.'))return;
  categories[curCatTab]=categories[curCatTab].filter(x=>x.id!==editCatId);
  save();renderCategories();closeModal('catModal');showToast('🗑️ 삭제가 완료되었습니다');
}

/* EMOJI PICKER SHARED SYSTEM */
function renderEmojiPicker(wrapperId){
  const ctx=curEmojiCtx,pageNames=Object.keys(EMOJI_PAGES);
  const pg=curEmojiPage[ctx]||pageNames[0];
  const emojis=EMOJI_PAGES[pg]||[];
  document.getElementById(wrapperId).innerHTML=`
    <div class="picker-tabs">${pageNames.map(p=>`<button class="picker-tab${p===pg?' active':''}" onclick="switchEmojiPage('${p}','${wrapperId}')">${p}</button>`).join('')}</div>
    <div class="custom-emoji-row">
      <input class="custom-emoji-input" id="${wrapperId}ci" placeholder="✏️" maxlength="4">
      <button class="custom-emoji-btn" onclick="applyCustomEmoji('${wrapperId}')">직접 입력</button>
      <span class="emoji-preview" id="${wrapperId}prev">${selEmoji||'?'}</span>
    </div>
    <div class="emoji-grid" id="${wrapperId}grid">
      ${emojis.map(e=>`<button class="emoji-btn${e===selEmoji?' selected':''}" onclick="pickEmoji('${e}','${wrapperId}')">${e}</button>`).join('')}
    </div>`;
}
function switchEmojiPage(page,wrapperId){curEmojiPage[curEmojiCtx]=page;renderEmojiPicker(wrapperId);}
function pickEmoji(e,wrapperId){selEmoji=e;document.getElementById(wrapperId+'prev').textContent=e;renderEmojiPicker(wrapperId);}
function applyCustomEmoji(wrapperId){
  const val=document.getElementById(wrapperId+'ci').value.trim();
  if(!val){showToast('⚠️ 아이콘을 입력해 주세요');return;}
  selEmoji=val;document.getElementById(wrapperId+'prev').textContent=val;
}

window.onload=function(){renderAll();};
</script>
